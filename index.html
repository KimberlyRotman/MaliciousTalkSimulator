<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malicious Talk Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="sidebar-header">
        <nav class="tabs">
          <button class="tab active" data-view="chats">Conversas</button>
          <button class="tab" data-view="config">Configurações</button>
        </nav>
      </header>
      <div class="sidebar-search">
        <input id="search" type="search" placeholder="Pesquisar contato" autocomplete="off">
      </div>
      <div id="sidebar-actions" class="sidebar-actions"></div>
      <ul id="contact-list" class="contact-list"></ul>
    </aside>
    <main id="main" class="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <input id="import-input" type="file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
